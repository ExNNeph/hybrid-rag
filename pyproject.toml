[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Question answering over internal docs (DE/EN): BM25 + local embeddings fused with RRF, a local cross-encoder rerank, Claude answers with quotes that are checked against the sources, and a semantic cache that does not fall for near-duplicates."
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "anthropic>=0.80", "numpy>=1.24", "sentence-transformers>=3"]

[project.optional-dependencies]
demo = ["streamlit>=1.50"]
dev = ["pytest", "streamlit>=1.50"]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hybrid_rag = ["docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
